<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Feliz día de las Flores Amarillas, Neyda. Un ramo de estrellas hecho con Three.js.">
    <meta name="theme-color" content="#0d0719">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Flores Amarillas">
    <meta property="og:title" content="Feliz día de las Flores Amarillas, Neyda">
    <meta property="og:description" content="El 21 de septiembre se regala una flor amarilla: quien la recibe sabe que su amor es correspondido.">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <style>
        :root {
            --sun: #FFD23F;
            --sun-soft: #FFE088;

            --dark: #020210;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Poppins', 'Quicksand', 'Segoe UI', sans-serif;
            color: #fff;

            -webkit-tap-highlight-color: transparent;
        }
        canvas { display: block; }

        @media (max-width: 700px) {
        }

<body>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const isMobile = Math.min(window.innerWidth, window.innerHeight) < 700 || 'ontouchstart' in window;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020210);
        scene.fog = new THREE.FogExp2(0x020210, 0.00045);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(16, 7, 21);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 0.95;
        document.body.appendChild(renderer.domElement);

        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85);
        bloomPass.threshold = 0.15;
        bloomPass.strength = isMobile ? 0.3 : 0.45;
        bloomPass.radius = isMobile ? 0.45 : 0.55;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.rotateSpeed = 1.2;
        controls.zoomSpeed = 1.0;
        controls.panSpeed = 0.5;
        controls.enableZoom = true;
        controls.autoRotate = !reducedMotion;
        controls.autoRotateSpeed = 0.5;
        controls.target.set(0, 0.3, 0);
        controls.minDistance = 6;
        controls.maxDistance = 34;

        let autoRotateTimer = null;
        controls.addEventListener('start', () => {
            controls.autoRotate = false;
            clearTimeout(autoRotateTimer);
        });
        controls.addEventListener('end', () => {
            clearTimeout(autoRotateTimer);
            if (reducedMotion) return;
            autoRotateTimer = setTimeout(() => { controls.autoRotate = true; }, 4000);
        });

        function createFlowerTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 128, 128);
            const cx = 64, cy = 64;

            if (type === 0) {
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const px = cx + Math.cos(angle) * 32;
                    const py = cy + Math.sin(angle) * 32;
                    ctx.beginPath();
                    ctx.ellipse(px, py, 22, 28, angle, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFE55C';
                    ctx.fill();
                }
            } else if (type === 1) {
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const px = cx + Math.cos(angle) * 38;
                    const py = cy + Math.sin(angle) * 38;
                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(angle);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 16, 30, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFD966';
                    ctx.fill();
                    ctx.restore();
                }
            } else {
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    const px = cx + Math.cos(angle) * 28;
                    const py = cy + Math.sin(angle) * 28;
                    ctx.beginPath();
                    ctx.ellipse(px, py, 14, 18, angle, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFE088';
                    ctx.fill();
                }
            }
            ctx.beginPath();
            ctx.arc(cx, cy, 16, 0, 2 * Math.PI);
            ctx.fillStyle = '#FF8C42';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx, cy, 10, 0, 2 * Math.PI);
            ctx.fillStyle = '#D2691E';
            ctx.fill();
            ctx.fillStyle = '#FFF2B5';
            for (let i = 0; i < 20; i++) {
                const rad = Math.random() * 12;
                const ang = Math.random() * Math.PI * 2;
                const x = cx + Math.cos(ang) * rad;
                const y = cy + Math.sin(ang) * rad;
                ctx.beginPath();
                ctx.arc(x, y, 1.2, 0, 2 * Math.PI);
                ctx.fill();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        const flowerTextures = [
            createFlowerTexture(0),
            createFlowerTexture(1),
            createFlowerTexture(2)
        ];

        const TOTAL_FLOWERS = isMobile ? 9000 : 18500;
        const positions = new Float32Array(TOTAL_FLOWERS * 3);
        const colors = new Float32Array(TOTAL_FLOWERS * 3);
        const sizes = new Float32Array(TOTAL_FLOWERS);
        const texIndices = new Float32Array(TOTAL_FLOWERS);

        const arms = 4;
        const spiralTightness = 2.6;
        const armSpread = 0.58;
        const innerRadius = 1.0;
        const outerRadius = 13.5;

        for (let i = 0; i < TOTAL_FLOWERS; i++) {
            let radius, angle, yOffset;
            const isCore = Math.random() < 0.3;
            if (isCore) {
                radius = Math.pow(Math.random(), 1.3) * 4.2;
                angle = Math.random() * Math.PI * 2;
                yOffset = (Math.random() - 0.5) * 1.6 * (1 - radius / 5);
            } else {
                const armIdx = Math.floor(Math.random() * arms);
                const armAngleOffset = (armIdx / arms) * Math.PI * 2;
                const t = Math.pow(Math.random(), 1.1);
                radius = innerRadius + t * (outerRadius - innerRadius);
                const spiralAngle = spiralTightness * Math.log(radius + 0.6) + armAngleOffset;
                const randomAngleOffset = (Math.random() - 0.5) * armSpread * (1 + radius * 0.08);
                angle = spiralAngle + randomAngleOffset;
                yOffset = Math.sin(radius * 1.4 + armIdx) * 0.85 + (Math.random() - 0.5) * 0.8;
                if (Math.random() > 0.7) yOffset += (Math.random() - 0.5) * 0.9;
            }
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = yOffset * 1.3;
            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            const distFactor = Math.min(1, Math.sqrt(x * x + y * y + z * z) / 14);
            let r = 1.0, g = 0.7 + Math.random() * 0.3, b = 0.1 + Math.random() * 0.3;
            if (distFactor < 0.3) { g = 0.55 + Math.random() * 0.2; b = 0.08; }
            if (distFactor > 0.7) { g = 0.92; b = 0.45; }
            colors[i * 3] = r;
            colors[i * 3 + 1] = g;
            colors[i * 3 + 2] = b;

            let sizeVal = 0.28 + Math.random() * 0.48;
            if (distFactor < 0.25) sizeVal *= 1.2;
            if (distFactor > 0.8) sizeVal *= 1.25;
            if (Math.random() > 0.93) sizeVal *= 1.55;
            sizes[i] = sizeVal;
            texIndices[i] = Math.floor(Math.random() * flowerTextures.length);
        }

        const flowerGeometry = new THREE.BufferGeometry();
        flowerGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        flowerGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        flowerGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        flowerGeometry.setAttribute('texIndex', new THREE.BufferAttribute(texIndices, 1));

        const vertexShader = `
            attribute float size;
            attribute vec3 color;
            attribute float texIndex;
            varying vec3 vColor;
            varying float vTexIndex;
            void main() {
                vColor = color;
                vTexIndex = texIndex;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * ( 300.0 / ( - mvPosition.z ) ) * 0.95;
                gl_PointSize = clamp(gl_PointSize, 5.0, 30.0);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            uniform sampler2D uTextures[3];
            varying vec3 vColor;
            varying float vTexIndex;
            void main() {
                int idx = int(round(vTexIndex));
                vec4 texColor;
                if (idx == 0) texColor = texture2D(uTextures[0], gl_PointCoord);
                else if (idx == 1) texColor = texture2D(uTextures[1], gl_PointCoord);
                else texColor = texture2D(uTextures[2], gl_PointCoord);
                if (texColor.a < 0.2) discard;
                vec3 finalColor = vColor * texColor.rgb;
                finalColor += vec3(0.08, 0.05, 0.02);
                gl_FragColor = vec4(finalColor, texColor.a * 0.85);
            }
        `;

        const flowerMaterial = new THREE.ShaderMaterial({
            uniforms: { uTextures: { value: flowerTextures } },
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const flowerPoints = new THREE.Points(flowerGeometry, flowerMaterial);
        scene.add(flowerPoints);

        const PETAL_SHAPE = new THREE.Shape();
        PETAL_SHAPE.moveTo(0, 0);
        PETAL_SHAPE.bezierCurveTo(0.05, 0.1, 0.24, 0.3, 0.3, 0.45);
        PETAL_SHAPE.bezierCurveTo(0.34, 0.56, 0.31, 0.72, 0.2, 0.84);
        PETAL_SHAPE.bezierCurveTo(0.13, 0.92, 0.06, 0.96, 0, 0.98);
        PETAL_SHAPE.bezierCurveTo(-0.06, 0.96, -0.13, 0.92, -0.2, 0.84);
        PETAL_SHAPE.bezierCurveTo(-0.31, 0.72, -0.34, 0.56, -0.3, 0.45);
        PETAL_SHAPE.bezierCurveTo(-0.24, 0.3, -0.05, 0.1, 0, 0);
        const PETAL_GEO = new THREE.ExtrudeGeometry(PETAL_SHAPE, {
            depth: 0.035,
            bevelEnabled: true,
            bevelThickness: 0.02,
            bevelSize: 0.025,
            bevelSegments: 2,
            steps: 1
        });

        const leafShape = new THREE.Shape();
        leafShape.moveTo(0, 0);
        leafShape.bezierCurveTo(0.2, -0.16, 0.6, -0.14, 0.78, -0.04);
        leafShape.bezierCurveTo(0.6, 0.1, 0.2, 0.1, 0, 0);
        const LEAF_GEO = new THREE.ShapeGeometry(leafShape);
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x4e9637, side: THREE.DoubleSide, roughness: 0.8 });

        const seedCanvas = document.createElement('canvas');
        seedCanvas.width = 512;
        seedCanvas.height = 512;
        const seedCtx = seedCanvas.getContext('2d');
        const seedGrad = seedCtx.createRadialGradient(256, 256, 8, 256, 256, 256);
        seedGrad.addColorStop(0, '#7a3b12');
        seedGrad.addColorStop(0.5, '#5a2c0c');
        seedGrad.addColorStop(1, '#3a1d07');
        seedCtx.fillStyle = seedGrad;
        seedCtx.fillRect(0, 0, 512, 512);
        for (let li = 0; li < 3000; li++) {
            const la = Math.random() * Math.PI * 2;
            const lr = Math.sqrt(Math.random()) * 246;
            const lx = 256 + Math.cos(la) * lr;
            const ly = 256 + Math.sin(la) * lr;
            seedCtx.fillStyle = Math.random() > 0.5 ? 'rgba(28,13,4,0.85)' : 'rgba(72,36,10,0.7)';
            seedCtx.beginPath();
            seedCtx.arc(lx, ly, 1 + Math.random() * 1.8, 0, Math.PI * 2);
            seedCtx.fill();
        }
        const seedTex = new THREE.CanvasTexture(seedCanvas);
        const centerMat = new THREE.MeshStandardMaterial({ map: seedTex, roughness: 0.9 });

        function createSunflower(x, z, yOffset, scaleFactor) {
            const group = new THREE.Group();

            const bend = (Math.random() - 0.5) * 0.5;
            const sway = (Math.random() - 0.5) * 0.45;
            const curvePts = [
                new THREE.Vector3(0, -0.62 * scaleFactor, 0),
                new THREE.Vector3(bend * 0.28 * scaleFactor, -0.28 * scaleFactor, sway * 0.28 * scaleFactor),
                new THREE.Vector3(bend * scaleFactor, 0.06 * scaleFactor, sway * scaleFactor)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(curvePts);
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x5a9e4e, roughness: 0.6, metalness: 0.1 });
            const stem = new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 10, 0.1 * scaleFactor, 6, false), stemMat);
            group.add(stem);

            const tipDir = bend * scaleFactor - bend * 0.28 * scaleFactor;
            const tipSway = sway * scaleFactor - sway * 0.28 * scaleFactor;
            const tiltX = bend * 0.35;
            const tiltZ = -sway * 0.3;

            const center = new THREE.Mesh(new THREE.SphereGeometry(0.28 * scaleFactor, 20, 20), centerMat);
            center.position.y = 0.04 * scaleFactor;
            group.add(center);

            const head = new THREE.Group();
            head.rotation.x = (Math.random() - 0.5) * 0.22 + tiltX;
            head.rotation.z = (Math.random() - 0.5) * 0.22 + tiltZ;
            head.position.set(bend * scaleFactor, 0.08 * scaleFactor, sway * scaleFactor);
            group.add(head);

            const petalMat = new THREE.MeshStandardMaterial({ color: 0xffd23b, emissive: 0xb8730a, emissiveIntensity: 0.35, roughness: 0.55 });
            petalMat.color.setHSL(0.1 + Math.random() * 0.02, 0.95, 0.5 + Math.random() * 0.1);

            const rings = [
                { count: 14, reach: 0.24, petScale: 0.8, phase: 0, tilt: 0.32 },
                { count: 10, reach: 0.3, petScale: 1.0, phase: Math.PI / 28, tilt: 0.18 }
            ];
            rings.forEach(ringObj => {
                for (let i = 0; i < ringObj.count; i++) {
                    const theta = (i / ringObj.count) * Math.PI * 2 + ringObj.phase + (Math.random() - 0.5) * 0.05;
                    const petal = new THREE.Mesh(PETAL_GEO, petalMat);
                    petal.rotation.order = 'YXZ';
                    petal.rotation.y = Math.PI / 2 - theta;
                    petal.rotation.x = Math.PI / 2 - ringObj.tilt + (Math.random() - 0.5) * 0.1;
                    petal.position.set(
                        Math.cos(theta) * ringObj.reach,
                        0.02 + (Math.random() - 0.5) * 0.02,
                        Math.sin(theta) * ringObj.reach
                    );
                    petal.scale.setScalar(ringObj.petScale * scaleFactor);
                    head.add(petal);
                }
            });

            const leaf1 = new THREE.Mesh(LEAF_GEO, leafMat);
            leaf1.position.set(0.24 * scaleFactor + bend * 0.55, -0.32 * scaleFactor, sway * 0.5);
            leaf1.rotation.y = -0.9;
            leaf1.rotation.z = 0.35 + bend * 0.3;
            leaf1.scale.setScalar(0.9 * scaleFactor);
            group.add(leaf1);

            const leaf2 = new THREE.Mesh(LEAF_GEO, leafMat);
            leaf2.position.set(-0.24 * scaleFactor + bend * 0.55, -0.34 * scaleFactor, sway * 0.5);
            leaf2.rotation.y = 0.7;
            leaf2.rotation.z = 0.3 + bend * 0.3;
            leaf2.scale.setScalar(0.9 * scaleFactor);
            group.add(leaf2);

            group.position.set(x, yOffset, z);
            group.rotation.y = Math.random() * Math.PI * 2;
            return group;
        }

        const sunflowerPositions = [];
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const radius = 2.5;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            sunflowerPositions.push({ x, z, y: 0.45, scale: 1.7 });
        }
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2 + Math.PI / 8;
            const radius = 3.8;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            sunflowerPositions.push({ x, z, y: 0.15, scale: 1.45 });
        }
        const armAngles = [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2];
        for (let a = 0; a < armAngles.length; a++) {
            for (let r = 3.5; r <= 12; r += 2.2) {
                const angleOffset = armAngles[a];
                const spiralBase = spiralTightness * Math.log(r + 0.8);
                const angle = spiralBase + angleOffset + (Math.random() - 0.5) * 0.8;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                const y = Math.sin(r * 1.2) * 0.4 + (Math.random() - 0.5) * 0.4;
                sunflowerPositions.push({ x, z, y: y - 0.1, scale: 0.8 + Math.random() * 0.5 });
            }
        }
        for (let i = 0; i < 12; i++) {
            const rad = 6 + Math.random() * 7;
            const ang = Math.random() * Math.PI * 2;
            const x = Math.cos(ang) * rad;
            const z = Math.sin(ang) * rad;
            const y = (Math.random() - 0.5) * 1.2;
            sunflowerPositions.push({ x, z, y: y, scale: 0.7 + Math.random() * 0.6 });
        }

        const sunflowersGroup = new THREE.Group();
        sunflowerPositions.forEach(pos => {
            const sunflower = createSunflower(pos.x, pos.z, pos.y, pos.scale);
            sunflowersGroup.add(sunflower);
        });
        scene.add(sunflowersGroup);

        const pollenCount = isMobile ? 800 : 1800;
        const pollenPositions = new Float32Array(pollenCount * 3);
        for (let i = 0; i < pollenCount; i++) {
            const idx = Math.floor(Math.random() * sunflowerPositions.length);
            const base = sunflowerPositions[idx];
            pollenPositions[i * 3] = base.x + (Math.random() - 0.5) * 1.2;
            pollenPositions[i * 3 + 1] = base.y + (Math.random() - 0.5) * 1.0 + 0.2;
            pollenPositions[i * 3 + 2] = base.z + (Math.random() - 0.5) * 1.2;
        }
        const pollenGeo = new THREE.BufferGeometry();
        pollenGeo.setAttribute('position', new THREE.BufferAttribute(pollenPositions, 3));
        const pollenMat = new THREE.PointsMaterial({ color: 0xffdd88, size: 0.04, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const pollenPoints = new THREE.Points(pollenGeo, pollenMat);
        scene.add(pollenPoints);

        const WORD_LIST = [
            'te quiero', 'la quiero mucho', 'te amo', 'la quiero',
            'preciosa', 'mi niña', 'que linda eres', 'eres muy hermosa',
            'tan linda', 'eres única', 'muy bonita', 'me gusta todo de ti',
            'me gusta pasar tiempo contigo', 'me gusta escucharla', 'me encanta verla',
            'me gusta verla', 'me gusta mirarla', 'me encanta verte sonreír',
            'me encanta verla sonreír', 'que mirada tan bonita',
            'me gusta tu voz', 'me gusta su voz', 'me siento tranquilo',
            'me siento bien con usted', 'solo con verla me pongo feliz',
            'me gustas poquito', 'me gusta usted',
            'quiero cuidarte', 'quiero cuidarla', 'no me voy a ir nunca',
            'todo va a estar bien', 'me haces feliz', 'usted me hace feliz',
            'contigo todo es mejor', 'me encanta pasar tiempo contigo',
            'me encanta estar con usted', 'eres mi mundo', 'usted es mi mundo',
            'mi cielo', 'mi amor', 'mi corazón', 'mi vida', 'te cuido mucho',
            'que descanses preciosa', 'que descanse preciosa', 'buenos días preciosa',
            'cuídate mucho', 'cuídese mucho', 'estoy aquí para ti',
            'estoy aquí para usted', 'es mi favorita', 'me encantó',
            'quiero estar contigo', 'quiero estar con usted', 'eres la única',
            'usted es la única', 'me haces mucha falta', 'usted me hace mucha falta'
        ];
        const WORD_COUNT = isMobile ? 160 : 280;
        const wordTexCache = {};
        const wordSprites = [];
        const wordBaseY = [];
        function getWordTexture(word) {
            if (wordTexCache[word]) return wordTexCache[word];
            const c = document.createElement('canvas');
            c.width = 640;
            c.height = 128;
            const g = c.getContext('2d');
            g.clearRect(0, 0, c.width, c.height);
            const maxWidth = 600;
            let fontPx = 80;
            g.font = "700 " + fontPx + "px 'Poppins','Quicksand',sans-serif";
            if (g.measureText(word).width > maxWidth) {
                fontPx = Math.max(36, Math.floor(80 * maxWidth / g.measureText(word).width));
                g.font = "700 " + fontPx + "px 'Poppins','Quicksand',sans-serif";
            }
            g.textAlign = 'center';
            g.textBaseline = 'middle';
            g.lineJoin = 'round';
            g.strokeStyle = 'rgba(45,22,4,0.9)';
            g.lineWidth = 12;
            g.strokeText(word, c.width / 2, c.height / 2);
            const grad = g.createLinearGradient(0, 0, 0, c.height);
            grad.addColorStop(0, '#FFF6D0');
            grad.addColorStop(1, '#FFD25F');
            g.fillStyle = grad;
            g.fillText(word, c.width / 2, c.height / 2);
            const tex = new THREE.CanvasTexture(c);
            wordTexCache[word] = tex;
            return tex;
        }
        const WORD_GA = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < WORD_COUNT; i++) {
            const word = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];
            const t = Math.sqrt(i / WORD_COUNT);
            const r = 2.4 + t * 10.5;
            const a = i * WORD_GA;
            const x = Math.cos(a) * r;
            const z = Math.sin(a) * r;
            const y = (Math.random() - 0.5) * 2.6 * (0.4 + t);
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({
                map: getWordTexture(word),
                transparent: true,
                depthWrite: false,
                opacity: 0.9
            }));
            const s = 0.34 + 0.26 * t;
            spr.scale.set(s * 4, s, 1);
            spr.position.set(x, y, z);
            scene.add(spr);
            wordSprites.push(spr);
            wordBaseY.push(y);
        }

        const nameCanvas = document.createElement('canvas');
        nameCanvas.width = 2048;
        nameCanvas.height = 768;
        const ng = nameCanvas.getContext('2d');
        ng.clearRect(0, 0, nameCanvas.width, nameCanvas.height);
        ng.textAlign = 'center';
        ng.textBaseline = 'middle';
        ng.lineJoin = 'round';
        ng.font = "800 230px 'Poppins','Quicksand',sans-serif";
        ng.strokeStyle = 'rgba(30,15,3,0.8)';
        ng.lineWidth = 26;
        ng.strokeText('NEYDA MISSEL', nameCanvas.width / 2, 280);
        const nGrad = ng.createLinearGradient(0, 100, 0, 460);
        nGrad.addColorStop(0, '#FFFbe8');
        nGrad.addColorStop(1, '#FFD25F');
        ng.fillStyle = nGrad;
        ng.fillText('NEYDA MISSEL', nameCanvas.width / 2, 280);
        ng.font = "700 190px 'Poppins','Quicksand',sans-serif";
        ng.strokeText('MOLINA VILLALOBOS', nameCanvas.width / 2, 560);
        ng.fillText('MOLINA VILLALOBOS', nameCanvas.width / 2, 560);
        const nameTex = new THREE.CanvasTexture(nameCanvas);
        const nameSprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: nameTex,
            transparent: true,
            depthWrite: false,
            opacity: isMobile ? 0.24 : 0.34,
            blending: THREE.AdditiveBlending
        }));
        const nameWorldW = isMobile ? 22 : 30;
        nameSprite.scale.set(nameWorldW, nameWorldW * (768 / 2048), 1);
        nameSprite.position.set(0, 4.5, -12);
        scene.add(nameSprite);

        const starCount = isMobile ? 6000 : 12000;
        const starPositionsArr = new Float32Array(starCount * 3);
        const starColorsArr = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const rad = 45 + Math.random() * 70;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starPositionsArr[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
            starPositionsArr[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta) * 0.85;
            starPositionsArr[i * 3 + 2] = rad * Math.cos(phi);
            const intens = 0.35 + Math.random() * 0.9;
            starColorsArr[i * 3] = intens * (Math.random() > 0.6 ? 1.0 : 0.7);
            starColorsArr[i * 3 + 1] = intens * (Math.random() > 0.5 ? 0.9 : 0.6);
            starColorsArr[i * 3 + 2] = intens * 0.55;
        }
        const starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositionsArr, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColorsArr, 3));
        const starMatObj = new THREE.PointsMaterial({ size: 0.14, vertexColors: true, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const starsField = new THREE.Points(starGeo, starMatObj);
        scene.add(starsField);

        const dustCount = isMobile ? 3500 : 8000;
        const dustPositions = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
            const radius = 5 + Math.random() * 14;
            const ang = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 4.5;
            dustPositions[i * 3] = Math.cos(ang) * radius * (0.6 + Math.random() * 0.7);
            dustPositions[i * 3 + 1] = y + (Math.random() - 0.5) * 1.5;
            dustPositions[i * 3 + 2] = Math.sin(ang) * radius * (0.6 + Math.random() * 0.7);
        }
        const dustGeoObj = new THREE.BufferGeometry();
        dustGeoObj.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMatObj = new THREE.PointsMaterial({ color: 0xffaa66, size: 0.04, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending });
        const dustCloud = new THREE.Points(dustGeoObj, dustMatObj);
        scene.add(dustCloud);

        const coreGlow = new THREE.Mesh(
            new THREE.SphereGeometry(1.35, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xf5b04a, emissive: 0xcc5500, emissiveIntensity: 1.15, roughness: 0.3 })
        );
        scene.add(coreGlow);

        const haloCount = isMobile ? 900 : 1500;
        const haloPositions = new Float32Array(haloCount * 3);
        for (let i = 0; i < haloCount; i++) {
            const rad = 1.6 + Math.random() * 1.5;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            haloPositions[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
            haloPositions[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta) * 0.7;
            haloPositions[i * 3 + 2] = rad * Math.cos(phi);
        }
        const haloGeo = new THREE.BufferGeometry();
        haloGeo.setAttribute('position', new THREE.BufferAttribute(haloPositions, 3));
        const haloMatPoints = new THREE.PointsMaterial({ color: 0xffaa77, size: 0.06, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const haloRing = new THREE.Points(haloGeo, haloMatPoints);
        scene.add(haloRing);

        const ambientLight = new THREE.AmbientLight(0x221100);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffaa55, 0.8, 30);
        pointLight.position.set(2, 1.5, 2);
        scene.add(pointLight);
        const backLight = new THREE.PointLight(0xffaa66, 0.45);
        backLight.position.set(-3, 2, -5);
        scene.add(backLight);
        const fillLight = new THREE.PointLight(0xffcc88, 0.4);
        fillLight.position.set(1, 3, 3);
        scene.add(fillLight);

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;

            if (!reducedMotion) {
                const intensity = 1.05 + Math.sin(time * 2.5) * 0.25;
                coreGlow.material.emissiveIntensity = intensity;
                pointLight.intensity = 0.8 + Math.sin(time * 2.2) * 0.2;
            }

            dustCloud.rotation.y = time * 0.03;
            if (!reducedMotion) {
                starsField.rotation.x = Math.sin(time * 0.05) * 0.05;
                starsField.rotation.y = time * 0.01;
            }
            haloRing.rotation.y = time * 0.1;
            haloRing.rotation.x = !reducedMotion ? Math.sin(time * 0.2) * 0.1 : 0;
            pollenPoints.rotation.y = time * 0.02;

            for (let i = 0; i < wordSprites.length; i++) {
                wordSprites[i].position.y = wordBaseY[i] + Math.sin(time * 0.9 + i) * 0.12;
            }

            if (!reducedMotion) {
                sunflowersGroup.children.forEach((sunflower, idx) => {
                    sunflower.rotation.z = Math.sin(time * 1.2 + idx) * 0.03;
                    sunflower.rotation.x = Math.cos(time * 1.0 + idx) * 0.02;
                });
            }

            controls.update();
            effectComposer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effectComposer.setSize(window.innerWidth, window.innerHeight);
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        console.log('Galaxia de girasoles lista');
    </script>
</body>
</html>
